# Render Blueprint: https://render.com/docs/blueprint-spec
# Python version comes from .python-version (3.14.6).
services:
  - type: web
    name: currency-converter-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn currency_converter.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Deploy only after the GitHub "Tests" workflow passes for the commit.
    autoDeployTrigger: checksPass
    envVars:
      # Secrets: Render asks for these in the dashboard; never commit them.
      - key: OXR_APP_ID
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # The browser sends the Origin without the path, so GitHub Pages is just the host.
      - key: CORS_ORIGINS
        value: https://sugixp.github.io,http://localhost:5500,http://127.0.0.1:5500
